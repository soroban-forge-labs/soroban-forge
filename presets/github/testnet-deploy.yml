# Generated by `soroban-forge ci-init --deploy`.
#
# Manual (workflow_dispatch) deploys to Stellar testnet, wrapping the official
# stellar-cli. Requires a repository/environment secret named
# STELLAR_DEPLOYER_SECRET holding the secret key (S...) of a funded testnet
# account. No keys are ever stored in this file — only GitHub secret
# references. Create one at: Settings → Secrets and variables → Actions.
name: testnet-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  STELLAR_CLI_VERSION: v27.0.0

jobs:
  deploy:
    name: "{{project_name}}: deploy to testnet"
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-
      - name: Cache stellar-cli
        id: cache-stellar-cli
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9  # v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}
      - name: Install stellar-cli
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        # Official binary from stellar-cli releases, pinned to a specific version.
        # See: https://github.com/stellar/stellar-cli/releases
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION#v}-$(uname -m)-unknown-linux-gnu.tar.gz" \
            | tar xz -C ~/.local/bin stellar
          chmod +x ~/.local/bin/stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build contract
        run: cargo build --target wasm32v1-none --release
      - name: Deploy to testnet
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          stellar contract deploy \
            --wasm "target/wasm32v1-none/release/{{crate_name}}.wasm" \
            --source-account "$STELLAR_DEPLOYER_SECRET" \
            --network testnet
