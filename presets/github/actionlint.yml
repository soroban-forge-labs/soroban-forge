# Generated by `soroban-forge ci-init --actionlint`.
# Validates the generated GitHub workflows with actionlint so syntax or
# expression mistakes fail in CI before they reach a release branch.
name: actionlint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: "{{project_name}}: workflow lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash
      - name: Lint workflows
        run: ./actionlint -color
