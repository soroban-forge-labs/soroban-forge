# Generated by `soroban-forge ci-init --security-scan`.
# Runs cargo-audit and cargo-deny on push and pull request to catch
# known-vulnerable dependencies and licensing / policy violations.
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run a daily scan at 07:00 UTC so new advisories are caught quickly.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: "{{project_name}}: cargo audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: "{{project_name}}: cargo deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca6268d5947d9b551ddb18e4fb9c  # v2
        with:
          command: check
          # deny.toml is read from the repo root; scaffold one with:
          #   soroban-forge ci-init --security-scan
          arguments: --config deny.toml
