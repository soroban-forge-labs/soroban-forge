# Generated by `soroban-forge ci-init`.
name: build-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "{{project_name}}: build & test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-
      - name: Run tests
        run: cargo test
      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release

  lint:
    name: "{{project_name}}: lint (rustfmt + clippy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # Both steps are hard failures: rustfmt --check exits non-zero on any
      # diff, and -D warnings promotes every clippy lint to an error.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
