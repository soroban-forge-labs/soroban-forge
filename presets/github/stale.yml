# Generated by `soroban-forge ci-init --stale`.
name: stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      days-before-stale:
        description: "Days without activity before marking an issue or PR stale"
        required: false
        type: number
        default: 30
      days-before-close:
        description: "Days to wait after an item becomes stale before closing it"
        required: false
        type: number
        default: 7

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    # Bounded so a hung run doesn't burn GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      # ci-init-step: stale/stale/stale-action
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9
        with:
          days-before-stale: ${{ inputs.days-before-stale || 30 }}
          days-before-close: ${{ inputs.days-before-close || 7 }}
          stale-issue-message: "This issue has been automatically marked as stale because it has been inactive for a while."
          stale-pr-message: "This pull request has been automatically marked as stale because it has been inactive for a while."
          close-issue-message: "This issue was closed because it has been inactive for too long."
          close-pr-message: "This pull request was closed because it has been inactive for too long."
