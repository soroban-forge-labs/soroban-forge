# Generated by `soroban-forge ci-init --release`.
#
# Tag-triggered release: builds the contract wasm, attaches it to a GitHub
# Release together with a SHA256 checksum file. Push a tag matching `v*.*.*`
# (e.g. `v0.1.0`) to trigger it.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: "{{project_name}}: build wasm & publish release"
    runs-on: ubuntu-latest
    # Bounded so a hung run doesn't burn GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      # ci-init-step: release/build-and-release/checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # ci-init-step: release/build-and-release/install-rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none
      # ci-init-step: release/build-and-release/rust-cache
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # ci-init-step: release/build-and-release/cache-wasm-target
      - name: Cache target/wasm32v1-none
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9  # v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-
      # ci-init-step: release/build-and-release/build-contract
      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release --locked
      # ci-init-step: release/build-and-release/checksum
      - name: Checksum
        run: |
          cd target/wasm32v1-none/release
          sha256sum {{crate_name}}.wasm > {{crate_name}}.wasm.sha256
      # ci-init-step: release/build-and-release/sign-release-artifacts
      - name: Sign release artifacts
        run: |
          openssl genrsa -out /tmp/release-signing.key 4096
          openssl rsa -in /tmp/release-signing.key -pubout -out /tmp/release-signing.pub
          cd target/wasm32v1-none/release
          openssl dgst -sha256 -sign /tmp/release-signing.key -out {{crate_name}}.wasm.sig {{crate_name}}.wasm
          openssl dgst -sha256 -sign /tmp/release-signing.key -out {{crate_name}}.wasm.sha256.sig {{crate_name}}.wasm.sha256
      # ci-init-step: release/build-and-release/verify-reproducible-build
      - name: Verify reproducible build
        # Clean and rebuild from the same commit; the wasm hash must match.
        # Catches non-determinism (timestamps, absolute paths, etc.) before
        # the release ships. See docs/contract-verification.md.
        run: |
          cp target/wasm32v1-none/release/{{crate_name}}.wasm /tmp/first-build.wasm
          cargo clean
          cargo build --target wasm32v1-none --release --locked
          if ! cmp -s /tmp/first-build.wasm target/wasm32v1-none/release/{{crate_name}}.wasm; then
            echo "::error::build is not reproducible: wasm differs between two builds of the same commit"
            exit 1
          fi
      # ci-init-step: release/build-and-release/verify-pinned-build
      - name: Verify reproducible build in pinned container
        env:
          RUST_IMAGE: "rust:1.84.0@sha256:12b68bb84516779d910706fb80f1705777459c1e5f6c7c0118c2fb4256d9ec3d"
        run: |
          HOST_WASM="target/wasm32v1-none/release/{{crate_name}}.wasm"
          HOST_HASH=$(sha256sum "$HOST_WASM" | awk '{print $1}')
          echo "host wasm sha256: ${HOST_HASH}"
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$RUST_IMAGE" \
            bash -lc 'rustup target add wasm32v1-none && cargo build --target wasm32v1-none --release --locked'
          CONTAINER_HASH=$(sha256sum "$HOST_WASM" | awk '{print $1}')
          echo "container wasm sha256: ${CONTAINER_HASH}"
          if [ "$HOST_HASH" != "$CONTAINER_HASH" ]; then
            echo "::error::Docker rebuild hash differs from the host build"
            exit 1
          fi
      # ci-init-step: release/build-and-release/create-release
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            /tmp/release-signing.pub
            target/wasm32v1-none/release/{{crate_name}}.wasm
            target/wasm32v1-none/release/{{crate_name}}.wasm.sha256
            target/wasm32v1-none/release/{{crate_name}}.wasm.sig
            target/wasm32v1-none/release/{{crate_name}}.wasm.sha256.sig
          generate_release_notes: true
