# Generated by `soroban-forge ci-init --release`.
#
# Tag-triggered release: builds the contract wasm, attaches it to a GitHub
# Release together with a SHA256 checksum file. Push a tag matching `v*.*.*`
# (e.g. `v0.1.0`) to trigger it.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: "{{project_name}}: build wasm & publish release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-
      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release --locked
      - name: Checksum
        run: |
          cd target/wasm32v1-none/release
          sha256sum {{crate_name}}.wasm > {{crate_name}}.wasm.sha256
      - name: Verify reproducible build
        # Clean and rebuild from the same commit; the wasm hash must match.
        # Catches non-determinism (timestamps, absolute paths, etc.) before
        # the release ships. See docs/contract-verification.md.
        run: |
          cp target/wasm32v1-none/release/{{crate_name}}.wasm /tmp/first-build.wasm
          cargo clean
          cargo build --target wasm32v1-none --release --locked
          if ! cmp -s /tmp/first-build.wasm target/wasm32v1-none/release/{{crate_name}}.wasm; then
            echo "::error::build is not reproducible: wasm differs between two builds of the same commit"
            exit 1
          fi
      - name: Verify reproducible build in pinned container
        env:
          RUST_IMAGE: "rust:1.84.0@sha256:12b68bb84516779d910706fb80f1705777459c1e5f6c7c0118c2fb4256d9ec3d"
        run: |
          HOST_WASM="target/wasm32v1-none/release/{{crate_name}}.wasm"
          HOST_HASH=$(sha256sum "$HOST_WASM" | awk '{print $1}')
          echo "host wasm sha256: ${HOST_HASH}"
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$RUST_IMAGE" \
            bash -lc 'rustup target add wasm32v1-none && cargo build --target wasm32v1-none --release --locked'
          CONTAINER_HASH=$(sha256sum "$HOST_WASM" | awk '{print $1}')
          echo "container wasm sha256: ${CONTAINER_HASH}"
          if [ "$HOST_HASH" != "$CONTAINER_HASH" ]; then
            echo "::error::Docker rebuild hash differs from the host build"
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wasm32v1-none/release/{{crate_name}}.wasm
            target/wasm32v1-none/release/{{crate_name}}.wasm.sha256
          generate_release_notes: true
