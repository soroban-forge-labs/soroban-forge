# Generated by `soroban-forge ci-init --healthcheck`.
# Scheduled verification: builds the contract, then checks that a deployed
# contract on a configured network matches the local release wasm.
name: testnet-healthcheck

on:
  schedule:
    # Run every 6 hours so drift between the deployed contract and the main branch
    # is caught quickly.
    - cron: "0 */6 * * *"
  # Allow manual re-runs from the Actions UI.
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Contract ID to verify against the local wasm"
        required: false
        default: ""
      network:
        description: "Soroban network name"
        required: false
        default: "testnet"
      rpc_url:
        description: "Optional RPC URL override"
        required: false
        default: ""

permissions:
  contents: read

env:
  CONTRACT_ID: ${{ inputs.contract_id || vars.SOROBAN_CONTRACT_ID || github.event.inputs.contract_id }}
  NETWORK: ${{ inputs.network || vars.SOROBAN_NETWORK || 'testnet' }}
  RPC_URL: ${{ inputs.rpc_url || vars.SOROBAN_RPC_URL || '' }}

jobs:
  healthcheck:
    name: "{{project_name}}: verify deployed contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-

      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release --locked

      - name: Install soroban-forge CLI
        run: cargo install --locked --git https://github.com/soroban-forge-labs/soroban-forge --branch main

      - name: Verify deployed contract matches local build
        run: |
          if [ -z "${CONTRACT_ID}" ]; then
            echo "::error::Set CONTRACT_ID via workflow input or a repo variable named SOROBAN_CONTRACT_ID."
            exit 1
          fi
          if [ -n "${RPC_URL}" ]; then
            soroban-forge verify "${CONTRACT_ID}" --network "${NETWORK}" --rpc-url "${RPC_URL}"
          else
            soroban-forge verify "${CONTRACT_ID}" --network "${NETWORK}"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::{{project_name}} deployment verification failed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
          echo "Check the contract ID, network, and RPC configuration above."
