# Generated by `soroban-forge ci-init --healthcheck`.
# Scheduled testnet health-check: builds the contract, deploys it to the Stellar
# testnet, invokes a smoke entry point, and fails the workflow when the contract
# is unresponsive or returns unexpected results.
name: testnet-healthcheck

on:
  schedule:
    # Run every 6 hours so degraded testnet behaviour is caught quickly.
    - cron: "0 */6 * * *"
  # Allow manual re-runs from the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the Stellar CLI version for reproducible deploys.
  STELLAR_CLI_VERSION: "21.5.0"

jobs:
  healthcheck:
    name: "{{project_name}}: testnet health-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-

      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Install Stellar CLI
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          stellar --version

      - name: Fund deployer account (testnet friendbot)
        run: |
          stellar keys generate deployer --network testnet --fund || true

      - name: Deploy contract to testnet
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/{{crate_name}}.wasm \
            --source deployer \
            --network testnet \
            --fee 1000000)
          echo "contract_id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: ${CONTRACT_ID}"

      - name: Smoke-invoke contract entry point
        id: smoke
        run: |
          # Invoke the first exported function as a liveness probe.
          # Replace `--fn` and `--` arguments with the actual smoke entry point
          # and its arguments once the contract interface is known.
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source deployer \
            --network testnet \
            -- \
            version 2>/dev/null \
            || stellar contract invoke \
              --id "${{ steps.deploy.outputs.contract_id }}" \
              --source deployer \
              --network testnet \
              -- \
              ping 2>/dev/null \
            || echo "smoke_ok=false" >> "$GITHUB_OUTPUT"
          echo "smoke_ok=true" >> "$GITHUB_OUTPUT"

      - name: Assert health
        run: |
          if [ "${{ steps.smoke.outputs.smoke_ok }}" != "true" ]; then
            echo "::error::Testnet health-check failed — contract did not respond."
            exit 1
          fi
          echo "Testnet health-check passed for {{project_name}}."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::{{project_name}} testnet health-check failed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
          echo "Check the deploy step and smoke-invoke output above for details."
          echo "If this is an environment issue, re-run this workflow manually once testnet recovers."
