# Generated by `soroban-forge ci-init --matrix`.
# Same job as build-test.yml, run once per Rust toolchain in the matrix so
# MSRV breakage is caught alongside stable.

name: build-test-matrix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "{{project_name}}: build & test (${{ matrix.toolchain }})"
    runs-on: ubuntu-latest
    # Bounded so a hung run doesn't burn GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "{{msrv}}"]
    steps:
      # ci-init-step: build-test-matrix/build-and-test/checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # ci-init-step: build-test-matrix/build-and-test/install-rust
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32v1-none
      # ci-init-step: build-test-matrix/build-and-test/rust-cache
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.toolchain }}
      # ci-init-step: build-test-matrix/build-and-test/cache-wasm-target
      - name: Cache target/wasm32v1-none
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9  # v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.toolchain }}
          restore-keys: |
            wasm-target-${{ runner.os }}-
      # ci-init-step: build-test-matrix/build-and-test/run-tests
      - name: Run tests
        run: cargo test
      # ci-init-step: build-test-matrix/build-and-test/build-contract
      - name: Build contract (wasm)
        run: cargo build --target wasm32v1-none --release
