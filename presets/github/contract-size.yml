# Generated by `soroban-forge ci-init`.
# Compares the built contract wasm size against the base branch and posts
# a PR comment with the delta. Fails when any contract exceeds MAX_WASM_KB.
name: contract-size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX_WASM_BYTES: {{max_size}}

jobs:
  contract-size:
    name: "{{project_name}}: contract size"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Cache target/wasm32v1-none
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32v1-none
          key: wasm-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-target-${{ runner.os }}-

      - name: Build contract (PR branch)
        run: cargo build --target wasm32v1-none --release

      - name: Record PR wasm sizes
        run: |
          mkdir -p /tmp/sizes
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -e "$wasm" ] || continue
            name=$(basename "$wasm")
            wc -c < "$wasm" > "/tmp/sizes/pr_${name}"
          done

      - name: Check max contract size
        run: |
          status=0
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -e "$wasm" ] || continue
            found=1
            size_bytes=$(wc -c < "$wasm")
            echo "$wasm: ${size_bytes} bytes (limit: ${MAX_WASM_BYTES} bytes)"
            if [ "$size_bytes" -gt "$MAX_WASM_BYTES" ]; then
              echo "::error file=$wasm::contract exceeds ${MAX_WASM_BYTES} bytes (actual: ${size_bytes} bytes)"
              status=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no .wasm produced by the build"
            status=1
          fi
          exit "$status"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: false

      - name: Build contract (base branch)
        run: |
          rm -f target/wasm32v1-none/release/*.wasm
          cargo build --target wasm32v1-none --release 2>/dev/null || true
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -e "$wasm" ] || continue
            name=$(basename "$wasm")
            wc -c < "$wasm" > "/tmp/sizes/base_${name}"
          done

      - name: Comment size delta on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '/tmp/sizes';
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            const pr = {}, base = {};
            for (const f of files) {
              const bytes = parseInt(fs.readFileSync(path.join(dir, f), 'utf8').trim());
              if (f.startsWith('pr_')) pr[f.slice(3)] = bytes;
              else if (f.startsWith('base_')) base[f.slice(5)] = bytes;
            }
            const allNames = [...new Set([...Object.keys(pr), ...Object.keys(base)])].sort();
            if (allNames.length === 0) return;
            let rows = '';
            let hasIncrease = false;
            for (const name of allNames) {
              const p = pr[name] || 0;
              const b = base[name] || 0;
              const delta = p - b;
              const sign = delta > 0 ? '+' : '';
              const icon = delta > 0 ? '\u26a0\ufe0f' : delta < 0 ? '\u2705' : '\u2796';
              if (delta > 0) hasIncrease = true;
              const bStr = b ? `${(b/1024).toFixed(1)} KB` : '\u2014';
              const pStr = p ? `${(p/1024).toFixed(1)} KB` : '\u2014';
              const dStr = !b ? 'new' : !p ? 'removed' : `${sign}${(delta/1024).toFixed(1)} KB`;
              rows += `| ${name} | ${bStr} | ${pStr} | ${dStr} | ${icon} |\n`;
            }
            const header = hasIncrease
              ? '\u26a0\ufe0f **Contract size increased**'
              : '\u2705 **Contract size check passed**';
            const body = `${header}\n\n` +
              `| Contract | Base | PR | Delta | |\n` +
              `|----------|------|-----|-------|---|\n` +
              rows +
              `\n<sub>Generated by soroban-forge ci-init \u00b7 contract-size workflow</sub>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = 'contract-size workflow';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
