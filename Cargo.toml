[package]
name = "soroban-forge"
description = "Scaffolding, test-harness and CI toolkit for Soroban smart contracts on Stellar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "soroban-forge"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/soroban-forge-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
soroban-forge-core = { path = "crates/core" }
soroban-forge-scaffold = { path = "crates/scaffold" }
soroban-forge-testgen = { path = "crates/testgen" }
soroban-forge-ci-presets = { path = "crates/ci-presets" }
soroban-forge-doctor = { path = "crates/doctor" }
soroban-forge-bindings-ts = { path = "crates/binding-ts" }
soroban-forge-templates = { path = "crates/templates" }
soroban-forge-spec = { path = "crates/spec" }
soroban-forge-verify = { path = "crates/verify" }
soroban-forge-identity = { path = "crates/identity" }
soroban-forge-network = { path = "crates/network" }
soroban-forge-optimize = { path = "crates/optimize" }
soroban-forge-init = { path = "crates/init" }
soroban-forge-deploy = { path = "crates/deploy" }
soroban-forge-invoke = { path = "crates/invoke" }
clap_complete.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[workspace]
members = ["crates/*"]
# Templates and generated examples are standalone cargo projects, not workspace members.
exclude = ["templates", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/soroban-forge-labs/soroban-forge"
rust-version = "1.84"

[workspace.dependencies]
soroban-forge-core = { path = "crates/core" }
soroban-forge-scaffold = { path = "crates/scaffold" }
clap = "4.5"
clap_complete = "4.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
log = "0.4"
env_logger = "0.11"
include_dir = "0.7"
tempfile = "3"
sha2 = "0.10"
