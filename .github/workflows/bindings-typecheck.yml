# Generates a TypeScript bindings package (with --react) for the token and
# nft templates and runs `tsc --noEmit` against the result, so a regression
# in the generator, the package.json rewrite, or the --react hooks fails CI
# instead of reaching consumers.
name: bindings-typecheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: v28.0.0
  STELLAR_CLI_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
  NODE_VERSION: "20"
  # The compiler actually used to type-check the generated output, pinned
  # independently of whatever `stellar contract bindings typescript` puts in
  # the generated package.json's own `typescript` devDependency.
  TS_VERSION: 5.6.2

jobs:
  typecheck:
    name: "bindings ts --react: ${{ matrix.template }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [token, nft]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Keyed per template: the scaffolded project's target/ is its own
          # cache entry instead of thrashing a single shared one.
          key: bindings-typecheck-${{ matrix.template }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache stellar-cli
        id: cache-stellar-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}
      - name: Install stellar-cli
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        # Official binary from stellar-cli releases, pinned to a specific
        # version. See: https://github.com/stellar/stellar-cli/releases
        run: |
          mkdir -p ~/.local/bin
          ARCHIVE="/tmp/stellar-cli.tar.gz"
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION#v}-$(uname -m)-unknown-linux-gnu.tar.gz" \
            -o "$ARCHIVE"
          echo "${STELLAR_CLI_SHA256}  $ARCHIVE" | sha256sum -c
          tar xz -f "$ARCHIVE" -C ~/.local/bin stellar
          rm -f "$ARCHIVE"
          chmod +x ~/.local/bin/stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build soroban-forge
        run: cargo build --release --bin soroban-forge
      - name: Scaffold ${{ matrix.template }}
        run: ./target/release/soroban-forge new smoke --template ${{ matrix.template }} --no-git --output-dir "$RUNNER_TEMP"
      - name: stellar contract build
        working-directory: ${{ runner.temp }}/smoke
        run: stellar contract build
      - name: Generate bindings (--react)
        working-directory: ${{ runner.temp }}/smoke
        run: '"$GITHUB_WORKSPACE/target/release/soroban-forge" bindings ts --react'
      - name: npm install
        working-directory: ${{ runner.temp }}/smoke/bindings/typescript
        run: npm install --no-audit --no-fund
      - name: "tsc --noEmit (pinned TypeScript ${{ env.TS_VERSION }})"
        working-directory: ${{ runner.temp }}/smoke/bindings/typescript
        run: npx --yes --package "typescript@${TS_VERSION}" tsc --noEmit

  python-typecheck:
    name: "bindings py: ${{ matrix.template }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [token, amm, governance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32v1-none
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
      - name: Install Python tooling
        run: pip install mypy stellar-sdk
      - name: Build soroban-forge
        run: cargo build --release --bin soroban-forge
      - name: Generate and type-check Python bindings
        run: |
          ./target/release/soroban-forge new smoke --template "${{ matrix.template }}" --no-git --output-dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/smoke" && stellar contract build)
          (cd "$RUNNER_TEMP/smoke" && "$GITHUB_WORKSPACE/target/release/soroban-forge" bindings-py)
          pip install "$RUNNER_TEMP/smoke/bindings/python"
          mypy --strict "$RUNNER_TEMP/smoke/bindings/python/client.py"
